[package]
name = "hexgate"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
authors = ["alexdesander <alexdesander@tuta.io>"]
description = "Efficient and easy-to-use udp based client-server game networking crate"
keywords = ["networking", "gamedev", "multiplayer", "netcode", "udp"]
categories = ["game-development", "game-engines", "network-programming"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/alexdesander/hexgate"

include = [
    "/src",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md"
]

[package.metadata.docs.rs]
features = ["sim"]

[dependencies]
aes-gcm = "0.11.1"
ahash = "0.8.12"
argon2 = { version = "0.6.0", optional = true }
bon = "3.10.2"
chacha20poly1305 = "0.11.0"
crossbeam-channel = "0.5.17"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
mio = { version = "1.2.4", features = ["net", "os-poll"] }
rand = "0.10.3"
sha2 = "0.11.0"
siphasher = "1.0.4"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["reusable_secrets"] }
priority-queue = "2.7.0"
tracing = { version = "0.1.44", optional = true }
rand_distr = { version = "0.6.0", optional = true }
num_enum = { version = "0.7.6", default-features = false }

[features]
default = ["argon2"]
# Argon2id hashing of the client's auth data (`hash_auth_data`).
argon2 = ["dep:argon2"]
# Debug and trace events for handshakes, connection changes and rejected packets.
tracing = ["dep:tracing"]
# Network simulation (`hexgate::sim`, `set_simulator`, the `simulator` builder settings).
sim = ["dep:rand_distr"]
# Internal entry points for the benchmarks in benches/, not part of the API.
bench = ["sim"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(fuzzing)",
    "cfg(aes_armv8)",
    "cfg(polyval_armv8)",
] }

[dev-dependencies]
anyhow = "1.0.104"
criterion = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
rand_distr = "0.6.0"
serde_json = "1.0.151"
text_io = "0.1.13"

[[bench]]
name = "packets"
harness = false
required-features = ["bench"]

[[bench]]
name = "channels"
harness = false
required-features = ["bench"]

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "cc"
harness = false
required-features = ["bench"]

[[bench]]
name = "network"
path = "benches/network/main.rs"
harness = false
required-features = ["sim"]

[[bench]]
name = "coexist"
harness = false

[[example]]
name = "chat_client"
required-features = ["sim"]

[[test]]
name = "channel_api"
required-features = ["sim"]

[[test]]
name = "congestion_regressions"
required-features = ["sim"]

[[test]]
name = "connection"
required-features = ["sim"]

[[test]]
name = "lifecycle_regressions"
required-features = ["sim"]

[[test]]
name = "network_metrics"
required-features = ["sim"]

[[test]]
name = "send_api"
required-features = ["sim"]

[[test]]
name = "transfer"
required-features = ["sim"]

[[test]]
name = "transport_regressions"
required-features = ["sim"]
