[package]
name = "hexgate"
version = "0.0.1"
edition = "2021"
rust-version = "1.86"
authors = ["alexdesander <alexdesander@tuta.io>"]
description = "Efficient and easy-to-use udp based client-server game networking crate"
keywords = ["networking", "gamedev", "multiplayer", "netcode", "udp"]
categories = ["game-development", "game-engines", "network-programming"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/alexdesander/hexgate"

include = [
    "/src",
    "/examples",
    "/LICENSE",
    "/README.md"
]

[dependencies]
aes-gcm = "0.10.3"
ahash = "0.8.11"
argon2 = "0.5.3"
bon = "3.1.1"
chacha20poly1305 = "0.10.1"
crossbeam-channel = "0.5.15"
ed25519-dalek = "2.1.1"
hkdf = "0.12.4"
mio = { version = "1.0.2", features = ["net", "os-poll"] }
rand = "0.8.5"
sha2 = "0.10.8"
siphasher = "1.0.1"
socket2 = { version = "0.5.8", features = ["all"] }
thiserror = "2.0.3"
x25519-dalek = { version = "2.0.1", features = ["reusable_secrets"] }
rand_xoshiro = "0.6.0"
priority-queue = "2.1.1"
tracing = { version = "0.1.44", optional = true }
rand_distr = "0.4.3"
num_enum = { version = "0.7.6", default-features = false }

[features]
# Debug and trace events for handshakes, connection changes and rejected packets.
tracing = ["dep:tracing"]
# Internal entry points for the benchmarks in benches/, not part of the API.
bench = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(fuzzing)",
    "cfg(aes_armv8)",
    "cfg(polyval_armv8)",
] }

[dev-dependencies]
anyhow = "1.0.93"
criterion = "0.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
text_io = "0.1.12"

[[bench]]
name = "packets"
harness = false
required-features = ["bench"]

[[bench]]
name = "channels"
harness = false
required-features = ["bench"]

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "cc"
harness = false
required-features = ["bench"]

[[bench]]
name = "network"
path = "benches/network/main.rs"
harness = false

[[bench]]
name = "coexist"
harness = false
